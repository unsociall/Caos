name: CAOS integrity unit tests

on:
  push:
    paths:
      - 'caos_integrity.py'
      - 'tests/test_caos_integrity.py'
      - '.github/workflows/integrity-tests.yml'
  pull_request:
    paths:
      - 'caos_integrity.py'
      - 'tests/test_caos_integrity.py'
      - '.github/workflows/integrity-tests.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test integrity module
        run: python -m unittest discover -s tests -p 'test_caos_integrity.py' -v
