name: CAOS memory integrity tests

on:
  push:
    paths:
      - 'caos_integrity.py'
      - 'caos_authenticated_integrity.py'
      - 'caos_memory_store.py'
      - 'caos_consistent_reader.py'
      - 'tests/test_caos_integrity.py'
      - 'tests/test_caos_authenticated_integrity.py'
      - 'tests/test_caos_memory_store.py'
      - 'tests/test_caos_consistent_reader.py'
      - 'tests/test_caos_multiprocess_locking.py'
      - '.github/workflows/integrity-tests.yml'
  pull_request:
    paths:
      - 'caos_integrity.py'
      - 'caos_authenticated_integrity.py'
      - 'caos_memory_store.py'
      - 'caos_consistent_reader.py'
      - 'tests/test_caos_integrity.py'
      - 'tests/test_caos_authenticated_integrity.py'
      - 'tests/test_caos_memory_store.py'
      - 'tests/test_caos_consistent_reader.py'
      - 'tests/test_caos_multiprocess_locking.py'
      - '.github/workflows/integrity-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all memory integrity unit tests
        run: python -m unittest discover -s tests -p 'test_caos*.py' -v
